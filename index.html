<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      background-color: #f4f6f8;
    }

    /* BOTÓN HAMBURGUESA PARA PANTALLAS PEQUEÑAS */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background-color: #0b112c;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* BARRA LATERAL (SIDEBAR) */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background-color: #0b112c;
      color: #a0aec0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .sidebar-menu {
      padding-top: 20px;
      overflow-y: auto;
    }

    /* Botones de navegación */
    .nav-item {
      width: 100%;
      background: transparent;
      border: none;
      color: #a0aec0;
      padding: 14px 20px;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .nav-item-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover {
      background-color: #151d3b;
      color: #ffffff;
    }

    .nav-item.active {
      background-color: #ffffff;
      color: #0b112c;
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .nav-item.active i {
      color: #0b112c;
    }

    /* Submenú desplegable */
    .submenu {
      display: none;
      background-color: #070b1e;
      padding-left: 15px;
    }

    .submenu.open {
      display: block;
    }

    .submenu-item {
      width: 100%;
      background: transparent;
      border: none;
      color: #718096;
      padding: 10px 15px 10px 35px;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: block;
      transition: all 0.2s ease;
    }

    .submenu-item:hover {
      color: #2dd4bf;
    }

    .submenu-item.active {
      color: #2dd4bf;
      font-weight: 700;
    }

    /* Footer del Sidebar */
    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid #1a2342;
      font-size: 0.75rem;
    }

    .subscription-badge {
      margin-bottom: 15px;
    }

    .subscription-badge span {
      display: block;
      color: #718096;
      text-transform: uppercase;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .subscription-badge strong {
      color: #ffffff;
      font-size: 0.85rem;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .logout-btn:hover {
      color: #ffffff;
    }

    /* ÁREA DE CONTENIDO PRINCIPAL */
    .content-container {
      flex: 1;
      width: calc(100vw - 260px);
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }

    .arrow-icon {
      transition: transform 0.3s ease;
      font-size: 0.7rem;
    }

    .arrow-icon.rotate {
      transform: rotate(180deg);
    }

    /* OVERLAY PARA CERRAR EL MENÚ EN MÓVILES */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
    }

    .overlay.active {
      display: block;
    }

    /* =========================================================
       MEDIA QUERIES - DISEÑO RESPONSIVO PARA TABLETS Y MÓVILES
       ========================================================= */
    @media (max-width: 992px) {
      .menu-toggle {
        display: block; /* Muestra botón hamburguesa */
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%); /* Oculta la barra fuera de pantalla */
      }

      .sidebar.mobile-open {
        transform: translateX(0); /* Desliza la barra hacia adentro */
      }

      .content-container {
        width: 100vw; /* El dashboard ocupa el 100% de la pantalla */
      }
    }
  </style>
</head>
<body>

  <!-- BOTÓN HAMBURGUESA PANTALLAS PEQUEÑAS -->
  <button class="menu-toggle" onclick="toggleSidebar()">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- CAPA OSCURA PARA CERRAR EL MENÚ AL HACER CLIC FUERA -->
  <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

  <!-- NAVEGACIÓN LATERAL -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-menu">
      
      <!-- Módulo 1 -->
      <button class="nav-item active" onclick="showDashboard('dash-radar', this)">
        <div class="nav-item-content">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Radar</span>
        </div>
      </button>

      <!-- Módulo 2 -->
      <button class="nav-item" onclick="showDashboard('dash-humor-social', this)">
        <div class="nav-item-content">
          <i class="fa-solid fa-users"></i>
          <span>Humor Social</span>
        </div>
      </button>

      <!-- Módulo 3 -->
      <button class="nav-item" onclick="showDashboard('dash-tensiones', this)">
        <div class="nav-item-content">
          <i class="fa-solid fa-file-lines"></i>
          <span>Tensiones Sociales</span>
        </div>
      </button>

      <!-- Módulo 4: OPOSITOR (2 DASHBOARDS) -->
      <button class="nav-item" onclick="toggleSubmenu('submenu-opositor', this)">
        <div class="nav-item-content">
          <i class="fa-solid fa-user-ninja"></i>
          <span>Análisis Opositor</span>
        </div>
        <i class="fa-solid fa-chevron-down arrow-icon"></i>
      </button>
      
      <!-- Submenú de Análisis Opositor -->
      <div id="submenu-opositor" class="submenu">
        <button class="submenu-item" onclick="showDashboard('dash-opositor-1', this)">
          • Opositor 1
        </button>
        <button class="submenu-item" onclick="showDashboard('dash-opositor-2', this)">
          • Opositor 2
        </button>
      </div>

      <!-- Módulo 5 -->
  
      <!-- Módulo 6: ESTUDIOS EXTRAS (3 DASHBOARDS) -->
      <button class="nav-item" onclick="toggleSubmenu('submenu-extras', this)">
        <div class="nav-item-content">
          <i class="fa-solid fa-folder"></i>
          <span>Estudios Extras</span>
        </div>
        <i class="fa-solid fa-chevron-down arrow-icon"></i>
      </button>
      
      <!-- Submenú de Estudios Extras -->
      <div id="submenu-extras" class="submenu">
        <button class="submenu-item" onclick="showDashboard('dash-extra-1', this)">
          • Estudio Extra 1
        </button>
        <button class="submenu-item" onclick="showDashboard('dash-extra-2', this)">
          • Estudio Extra 2
        </button>
        <button class="submenu-item" onclick="showDashboard('dash-extra-3', this)">
          • Estudio Extra 3
        </button>
      </div>

    </div>

    <!-- PIE DEL SIDEBAR -->
   
  </aside>

  <!-- CONTENEDOR DE VISUALIZACIÓN DE DASHBOARDS -->
  <main class="content-container">
    <!-- Ajusta el atributo 'src' de cada iframe con la ruta real de tus archivos .html -->
    <iframe id="dash-radar" class="active" src="RADAR_Imelda_Castro.html"></iframe>
    <iframe id="dash-humor-social" src="EMOCIONES_SINALOA.html"></iframe>
    <iframe id="dash-tensiones" src="Tensiones_Sinaloa.html"></iframe>
    
    <!-- Dashboards del Módulo Análisis Opositor -->
    <iframe id="dash-opositor-1" src="OPOSITOR-SINALOA.html"></iframe>
    <iframe id="dash-opositor-2" src="OPOSITOR_IMELDA.html"></iframe>

    
    <!-- Dashboards del Módulo Estudios Extras -->
    <iframe id="dash-extra-1" src="SESGO_Sinaloa.html"></iframe>
    <iframe id="dash-extra-2" src="Semiótica_Sinaloa.html"></iframe>
    <iframe id="dash-extra-3" src="Socioafectiva_Sinaloa.html"></iframe>
  </main>

  <script>
    function showDashboard(iframeId, element) {
      // 1. Ocultar todos los iframes
      const iframes = document.querySelectorAll('.content-container iframe');
      iframes.forEach(iframe => iframe.classList.remove('active'));

      // 2. Remover clase 'active' de botones y submenús
      const navButtons = document.querySelectorAll('.nav-item, .submenu-item');
      navButtons.forEach(btn => btn.classList.remove('active'));

      // 3. Activar el iframe seleccionado
      const targetIframe = document.getElementById(iframeId);
      if(targetIframe) {
        targetIframe.classList.add('active');
      }

      // 4. Activar el botón presionado
      element.classList.add('active');

      if (element.classList.contains('submenu-item')) {
        const parentNav = element.closest('.submenu').previousElementSibling;
        if (parentNav) parentNav.classList.add('active');
      }

      // En pantallas pequeñas, cerrar el menú lateral automáticamente al presionar una opción
      if (window.innerWidth <= 992) {
        toggleSidebar();
      }
    }

    function toggleSubmenu(submenuId, element) {
      const submenu = document.getElementById(submenuId);
      const arrow = element.querySelector('.arrow-icon');
      
      submenu.classList.toggle('open');
      if (arrow) {
        arrow.classList.toggle('rotate');
      }
    }

    // Función para abrir/cerrar la barra lateral en pantallas pequeñas
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('active');
    }
  </script>

</body>
</html>
